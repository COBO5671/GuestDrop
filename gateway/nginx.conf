worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_max_body_size 81m;
  client_body_timeout 1h;
  send_timeout 1h;
  upstream guestdrop_app { server app:8081; }
  upstream guestdrop_uploader { server uploader:8090; }
  server {
    listen 8080;
    location ~ ^/api/uploads/[0-9a-f-]+/chunk$ {
      proxy_pass http://guestdrop_uploader;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /internal/ { return 404; }
    location / {
      proxy_pass http://guestdrop_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
