services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      UPLOAD_DIR: /uploads
    volumes:
      - ./data:/data
      - ./uploads:/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  uploader:
    build: ./uploader
    restart: unless-stopped
    env_file: .env
    environment:
      APP_INTERNAL_URL: http://app:8081
      UPLOAD_DIR: /uploads
    volumes:
      - ./uploads:/uploads
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "/uploader", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  guestdrop:
    image: nginx:1.29-alpine
    container_name: guestdrop
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
      uploader:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=16m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
